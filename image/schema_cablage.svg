<text x="1372" y="820" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Alimentation 5 V</text>
<text x="1372" y="837" font-size="11" text-anchor="start" font-weight="normal" fill="#6e7781">convertisseur 12 V vers 5 V (fusible 2 A sur le +12 V)</text>
<text x="1048" y="881" font-size="14" text-anchor="end" font-weight="normal" fill="#111">GND</text>
<line x1="1060" y1="876" x2="1360" y2="876" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="1360" y="856" width="420" height="40" rx="8" fill="#f6f8fa" stroke="#333" stroke-width="1.8"/>
<text x="1372" y="881" font-size="13" text-anchor="start" font-weight="normal" fill="#111">Masse commune (batterie - , alim, capteurs)</text>
<rect x="60" y="966" width="1720" height="224" rx="8" fill="#fffdf5" stroke="#caa" stroke-width="1.5"/>
<text x="80" y="994" font-size="13" text-anchor="start" font-weight="normal" fill="#111">Legende : bleu = SPI ecran | vert = bus et donnees | orange = entrees numeriques (via optocoupleur ou bouton) | violet = entrees analogiques | rouge = alimentation | noir = masse</text>
<text x="80" y="1022" font-size="12" text-anchor="start" font-weight="normal" fill="#111">- Bandeau LED : +5 V et GND directs, condensateur 1000 uF sur l'alimentation, resistance 330 ohm en serie sur DIN. GPS : VCC en 3,3 V ou 5 V selon le module. MPU-6050 et GPS sur 3V3, masses communes.</text>
<text x="80" y="1046" font-size="12" text-anchor="start" font-weight="normal" fill="#111">- Optocoupleurs : cote LED = signal 12 V + resistance 2,2 k a 4,7 k vers la masse voiture ; cote transistor = collecteur sur le GPIO, emetteur sur GND (le code active le pull-up interne, l'entree passe a 0 quand le signal est present).</text>
<text x="80" y="1070" font-size="12" text-anchor="start" font-weight="normal" fill="#111">- GPIO 34, 35, 36 et 39 sont des entrees seules : pas de pull-up interne. Seul le GPIO 35 (feux de croisement) exige donc une resistance de 10 k vers 3,3 V.</text>
<text x="80" y="1094" font-size="12" text-anchor="start" font-weight="normal" fill="#111">- Ne pas mettre de resistance externe sur GPIO 12 (broche de demarrage de l'ESP32) ni sur GPIO 2 : le pull-up interne suffit.</text>
<text x="80" y="1118" font-size="12" text-anchor="start" font-weight="normal" fill="#111">- Bandeau WS2812B : alimenter directement en 5 V (jusqu'a 1,5 A pour 24 LED), masse commune avec l'ESP32 ; un adaptateur de niveau 74AHCT125 sur DIN est recommande.</text>
<text x="80" y="1142" font-size="12" text-anchor="start" font-weight="normal" fill="#111">- Les valeurs de resistances des sondes (temperature, essence) sont a adapter a vos capteurs d'origine ; verifier la tension sur le GPIO : jamais plus de 3,3 V.</text>
</svg>